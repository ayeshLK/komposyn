name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.9
          cache: true

      - name: Verify formatting
        if: matrix.os == 'ubuntu-latest'
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"

      - name: Verify modules
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Check known Go vulnerabilities
        if: matrix.os == 'ubuntu-latest'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: Test
        run: go test ./...

  standalone-cli-compatibility:
    name: Standalone CLI compatibility
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out candidate core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.9
          cache: false

      - name: Check out public standalone CLI
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: git clone --depth 1 https://github.com/ayeshLK/komposyn-lg.git "$RUNNER_TEMP/komposyn-lg"

      - name: Test standalone CLI against candidate core
        shell: bash
        env:
          CLI_DIR: ${{ runner.temp }}/komposyn-lg
        run: |
          cd "$CLI_DIR"
          GOWORK=off go mod edit -replace="github.com/ayeshLK/komposyn=$GITHUB_WORKSPACE"
          replacement_dir="$(GOWORK=off go list -m -f '{{if .Replace}}{{.Replace.Dir}}{{end}}' github.com/ayeshLK/komposyn)"
          [[ "$replacement_dir" == "$GITHUB_WORKSPACE" ]] || {
            echo "CLI test is not using candidate core: $replacement_dir" >&2
            exit 1
          }
          GOWORK=off go test ./...

  collector-baseline-compatibility:
    name: Collector baseline compatibility
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out candidate core history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.9
          cache: true

      - name: "Compare candidate behavior with merged #141"
        run: bash scripts/verify-collector-baseline.sh

  race:
    name: Race tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.9
          cache: true

      - name: Race tests
        run: go test -race ./...
