name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.9
          cache: true

      - name: Verify formatting
        if: matrix.os == 'ubuntu-latest'
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"

      - name: Verify modules
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Check known Go vulnerabilities
        if: matrix.os == 'ubuntu-latest'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: Test
        run: go test ./...

      - name: Build CLI
        run: go build -trimpath ./plugins/cli/token-logger

      - name: Verify Windows release resolution
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/test-release-resolution.ps1

      - name: Verify Unix installer resolution and trust
        if: runner.os != 'Windows'
        run: bash scripts/test-installer-trust.sh

  race:
    name: Race tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.9
          cache: true

      - name: Race tests
        run: go test -race ./...
