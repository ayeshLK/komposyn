name: Publish release

on:
  workflow_dispatch:
    inputs:
      confirm_issue_46_gates:
        description: Confirm issue #46 API, schema/backup, diagnostics, and version gates are complete
        required: true
        type: boolean
      release_commit:
        description: Optional master commit for a reviewed-release retry after a post-merge fix
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate prepared release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - name: Check out master
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: master

      - name: Resolve merged release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT_INPUT: ${{ inputs.release_commit }}
        shell: bash
        run: |
          mapfile -t pending < <(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state merged \
              --label "autorelease: pending" \
              --json number,mergeCommit \
              --jq '.[] | select(.mergeCommit.oid != null) | "\(.number) \(.mergeCommit.oid)"'
          )
          if [[ "${#pending[@]}" -ne 1 ]]; then
            printf 'Expected exactly one merged Release Please PR, found %s:\n' "${#pending[@]}" >&2
            printf '%s\n' "${pending[@]}" >&2
            exit 1
          fi
          prepared_commit="${pending[0]##* }"
          commit="$prepared_commit"
          if [[ -n "$RELEASE_COMMIT_INPUT" ]]; then
            git cat-file -e "$RELEASE_COMMIT_INPUT^{commit}"
            git merge-base --is-ancestor "$prepared_commit" "$RELEASE_COMMIT_INPUT" || {
              echo "Recovery commit must descend from the merged release PR commit $prepared_commit" >&2
              exit 1
            }
            git merge-base --is-ancestor "$RELEASE_COMMIT_INPUT" HEAD || {
              echo "Recovery commit must be reachable from master" >&2
              exit 1
            }
            commit="$RELEASE_COMMIT_INPUT"
            echo "Using reviewed-release recovery commit $commit after $prepared_commit"
          fi
          git cat-file -e "$commit^{commit}"
          git checkout --detach "$commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Confirm issue #46 release gates
        if: inputs.confirm_issue_46_gates != true
        run: |
          echo 'Issue #46 API, schema/backup, diagnostics, and version gates must be complete before publication' >&2
          exit 1

      - name: Read and validate prepared version
        id: version
        shell: bash
        run: |
          VERSION="$(jq -er '.["."] | select(type == "string")' .release-please-manifest.json)"
          if [[ "$VERSION" == "0.0.0" || ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Prepared release must be a non-zero semantic version" >&2
            exit 1
          fi
          TAG="v$VERSION"
          existing_commit="$(git rev-parse --verify --quiet "refs/tags/$TAG^{commit}" || true)"
          if [[ -n "$existing_commit" && "$existing_commit" != "$(git rev-parse HEAD)" ]]; then
            echo "Tag $TAG exists at $existing_commit, not the tested release commit" >&2
            exit 1
          fi
          version_pattern="${VERSION//./\\.}"
          if ! grep -Eq "^## (\\[$version_pattern\\](\\([^)]*\\))?|$version_pattern)( |$)" CHANGELOG.md; then
            echo "CHANGELOG.md has no release section for $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Record tested commit
        id: commit
        shell: bash
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify modules
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Race tests
        run: go test -race ./...

  build-release:
    name: Build and sign release artifacts
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release artifacts
        run: |
          make release VERSION="${{ needs.prepare.outputs.tag }}" OUTPUT_DIR=dist

      - name: Verify installation, upgrade, and uninstall
        run: bash scripts/verify-release.sh dist

      - name: Install Cosign
        run: go install github.com/sigstore/cosign/v2/cmd/cosign@v2.4.3

      - name: Sign release artifacts
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          for artifact in dist/komposyn-lg_* dist/SHA256SUMS; do
            cosign sign-blob --yes \
              --output-signature "${artifact}.sig" \
              --output-certificate "${artifact}.pem" \
              "$artifact"
            cosign verify-blob \
              --signature "${artifact}.sig" \
              --certificate "${artifact}.pem" \
              --certificate-identity-regexp '^https://github.com/ayeshLK/komposyn/.github/workflows/release.yml@refs/heads/master$' \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "$artifact"
          done

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artifacts
          path: dist
          if-no-files-found: error

  verify-installers:
    name: Verify installer (${{ matrix.os }})
    needs: [prepare, build-release]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download signed release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-artifacts
          path: dist

      - name: Install Cosign (Unix)
        if: runner.os != 'Windows'
        run: |
          go install github.com/sigstore/cosign/v2/cmd/cosign@v2.4.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Cosign (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: go install github.com/sigstore/cosign/v2/cmd/cosign@v2.4.3

      - name: Verify Unix installer lifecycle
        if: runner.os != 'Windows'
        env:
          KOMPOSYN_VERSION: ${{ needs.prepare.outputs.tag }}
          KOMPOSYN_RELEASE_DIR: ${{ github.workspace }}/dist
          KOMPOSYN_INSTALL_DIR: ${{ runner.temp }}/komposyn-bin
          TOKEN_LOGGER_DATA_DIR: ${{ runner.temp }}/komposyn-data
        run: |
          bash scripts/install.sh
          "$KOMPOSYN_INSTALL_DIR/komposyn-lg" version
          "$KOMPOSYN_INSTALL_DIR/komposyn-lg" settings --collector off --auto-start off
          test -f "$TOKEN_LOGGER_DATA_DIR/settings.json"
          test -f "$TOKEN_LOGGER_DATA_DIR/token-logger.db"
          bash scripts/install.sh
          test -f "$TOKEN_LOGGER_DATA_DIR/settings.json"
          test -f "$TOKEN_LOGGER_DATA_DIR/token-logger.db"
          bash scripts/uninstall.sh
          test ! -e "$KOMPOSYN_INSTALL_DIR/komposyn-lg"
          test -f "$TOKEN_LOGGER_DATA_DIR/settings.json"
          test -f "$TOKEN_LOGGER_DATA_DIR/token-logger.db"

      - name: Verify Windows installer lifecycle
        if: runner.os == 'Windows'
        env:
          KOMPOSYN_VERSION: ${{ needs.prepare.outputs.tag }}
          KOMPOSYN_RELEASE_DIR: ${{ github.workspace }}/dist
        shell: pwsh
        run: |
          $env:KOMPOSYN_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'komposyn-bin'
          $env:TOKEN_LOGGER_DATA_DIR = Join-Path $env:RUNNER_TEMP 'komposyn-data'
          $gopath = go env GOPATH
          $env:KOMPOSYN_COSIGN_BIN = Join-Path $gopath 'bin/cosign.exe'
          & ./scripts/install.ps1
          $binary = Join-Path $env:KOMPOSYN_INSTALL_DIR 'komposyn-lg.exe'
          & $binary version
          & $binary settings --collector off --auto-start off
          if (-not (Test-Path (Join-Path $env:TOKEN_LOGGER_DATA_DIR 'settings.json'))) { throw 'settings were not created' }
          if (-not (Test-Path (Join-Path $env:TOKEN_LOGGER_DATA_DIR 'token-logger.db'))) { throw 'database was not created' }
          & ./scripts/install.ps1
          & ./scripts/uninstall.ps1
          if (Test-Path $binary) { throw 'uninstall left executable behind' }
          if (-not (Test-Path (Join-Path $env:TOKEN_LOGGER_DATA_DIR 'settings.json'))) { throw 'uninstall removed settings' }
          if (-not (Test-Path (Join-Path $env:TOKEN_LOGGER_DATA_DIR 'token-logger.db'))) { throw 'uninstall removed database' }

  publish:
    name: Publish GitHub release
    needs: [prepare, build-release, verify-installers]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out tested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Download signed release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-artifacts
          path: dist

      - name: Create draft release and upload signed assets
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        shell: bash
        run: |
          mapfile -t archives < <(find dist -maxdepth 1 -type f \( -name 'komposyn-lg_*.tar.gz' -o -name 'komposyn-lg_*.zip' \) -print | sort)
          [[ "${#archives[@]}" -eq 6 ]] || {
            echo "Expected six release archives, found ${#archives[@]}" >&2
            exit 1
          }
          assets=("${archives[@]}" "dist/SHA256SUMS")
          for checksum_signature in dist/SHA256SUMS.sig dist/SHA256SUMS.pem; do
            [[ -f "$checksum_signature" ]] || {
              echo "Missing signed asset: $checksum_signature" >&2
              exit 1
            }
            assets+=("$checksum_signature")
          done
          for archive in "${archives[@]}"; do
            for suffix in .sig .pem; do
              signed_asset="${archive}${suffix}"
              [[ -f "$signed_asset" ]] || {
                echo "Missing signed asset: $signed_asset" >&2
                exit 1
              }
              assets+=("$signed_asset")
            done
          done

          notes_file="$RUNNER_TEMP/release-notes.md"
          awk -v version="${RELEASE_TAG#v}" '
            /^## / {
              if (found) exit
              plain="## " version
              linked="## [" version "]"
              if ($0 == plain || index($0, plain " ") == 1 ||
                  $0 == linked || index($0, linked "(") == 1 ||
                  index($0, linked " ") == 1) {
                found=1
                next
              }
            }
            found { print }
          ' CHANGELOG.md > "$notes_file"
          [[ -s "$notes_file" ]] || {
            echo "Reviewed changelog entry for $RELEASE_TAG is empty or missing" >&2
            exit 1
          }

          existing_commit="$(git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG^{commit}" || true)"
          if [[ -n "$existing_commit" && "$existing_commit" != "$RELEASE_COMMIT" ]]; then
            echo "Existing tag $RELEASE_TAG points to $existing_commit, expected $RELEASE_COMMIT" >&2
            exit 1
          fi
          release_exists=false
          if release_json="$(gh release view "$RELEASE_TAG" --json isDraft 2>/dev/null)"; then
            release_exists=true
            [[ "$(jq -r '.isDraft' <<<"$release_json")" == true ]] || {
              echo "Release $RELEASE_TAG already exists and is published" >&2
              exit 1
            }
          fi
          if [[ "$release_exists" == false ]]; then
            if [[ -n "$existing_commit" ]]; then
              gh release create "$RELEASE_TAG" --draft --verify-tag --notes-file "$notes_file"
            else
              gh release create "$RELEASE_TAG" --draft --target "$RELEASE_COMMIT" --notes-file "$notes_file"
            fi
          else
            gh release edit "$RELEASE_TAG" --notes-file "$notes_file"
          fi

          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          tagged_commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
          [[ "$tagged_commit" == "$RELEASE_COMMIT" ]] || {
            echo "Tag $RELEASE_TAG resolves to $tagged_commit, expected $RELEASE_COMMIT" >&2
            exit 1
          }
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          expected_assets="$(for asset in "${assets[@]}"; do basename "$asset"; done | sort)"
          actual_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort)"
          [[ "$actual_assets" == "$expected_assets" ]] || {
            echo 'Draft release asset set does not exactly match the signed build output' >&2
            diff -u <(printf '%s\n' "$expected_assets") <(printf '%s\n' "$actual_assets") || true
            exit 1
          }
          gh release edit "$RELEASE_TAG" --draft=false

      - name: Verify published release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
          [[ "$is_draft" == false ]] || {
            echo "release was not published" >&2
            exit 1
          }

      - name: Remove completed release marker
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
        run: |
          gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state merged \
            --label "autorelease: pending" \
            --json number \
            --jq '.[].number' | while read -r number; do
              gh pr edit "$number" --remove-label "autorelease: pending"
            done
