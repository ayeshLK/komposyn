name: Prepare or tag a reviewed source release

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-please-master
  cancel-in-progress: false

jobs:
  release-please:
    name: Run Release Please on explicit dispatch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Require master dispatch
        env:
          EVENT_REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          test "$REPOSITORY" = ayeshLK/komposyn
          test "$EVENT_REF" = refs/heads/master || {
            echo "Run Release Please from master." >&2
            exit 1
          }

      - name: Prepare reviewed source release or release merged tag
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: master
